[project]
name = "fly-in"
version = "1.0.0"
description = "Multi-drone routing simulator"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["mypy", "pytest", "flake8", "ruff", "pydantic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_in"]
