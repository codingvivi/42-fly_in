[project]
name = "fly-in"
version = "1.0.0"
description = "Multi-drone routing simulator"
requires-python = ">=3.10"
dependencies = ["pydantic"]

[dependency-groups]
dev = ["mypy", "pytest", "flake8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 79
# src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/fly_in"]

[tool.pytest.ini_options]
# pathing for tests 
pythonpath = ["test"]
addopts = "--strict-markers"
